name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --force
      - name: Run ESLint
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: http://localhost:8000
      VITE_BUNNY_NET_STORAGE_URL: https://storage.bunnycdn.com/dummy
      VITE_BUNNY_NET_CDN_URL: https://dummy.b-cdn.net/
      VITE_BUNNY_NET_API_KEY: dummy
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --force
      - name: Run unit & component tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --force
      - name: Build Vite app
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 8000
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-minimum-32-chars-long' }}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: testdb
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
      VITE_BACKEND_URL: http://localhost:8000
      VITE_BUNNY_NET_STORAGE_URL: https://storage.bunnycdn.com/dummy
      VITE_BUNNY_NET_CDN_URL: https://dummy.b-cdn.net/
      VITE_BUNNY_NET_API_KEY: dummy
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: Cavalier1204/JVEPortfolio-BE
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Migrate & Seed backend database
        working-directory: backend
        run: |
          npm run db:push
          npm run seed

      - name: Start backend
        working-directory: backend
        run: npm run dev &

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8000/health && break
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Install frontend dependencies
        run: npm ci --force

      - name: Install Playwright & dependencies
        run: |
          npx playwright install
          npx playwright install-deps ${{ matrix.browser }}

      - name: Run frontend E2E tests
        run: npx playwright test --project=${{ matrix.browser }} --reporter=list,json,html --pass-with-no-tests

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
